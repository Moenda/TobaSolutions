plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.toba.app'
    compileSdk 35

    defaultConfig {
        applicationId "br.com.toba.app"
        minSdk 29
        // 34 de propósito: no 35 o Android desenha o site por baixo da barra de status.
        targetSdk 34
        // Mudou algo na parte nativa? Aumente os dois antes de gerar o APK.
        versionCode 16
        versionName "2.5"
        // O app abre o site publicado: patch no site = app atualizado, sem APK novo.
        buildConfigField "String", "START_URL", "\"https://moenda.github.io/TobaSolutions/\""
        buildConfigField "String", "SITE_HOST", "\"moenda.github.io\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // App de uso pessoal (fora da Play Store): o aviso de "targetSdk antigo"
    // não pode travar a geração do APK.
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    // v1.75: o Android Auto mora em app/auto/ (pasta curta de propósito: o Cloba só
    // consegue gravar até 7 pastas pra dentro do repositório, e o java/br/com/toba/app/ passa disso).
    // v1.77 (APK 1.6): MainActivity e TobaBridge também moram em auto/br/com/toba/app/
    // (apagar os de src/main/java/br/com/toba/app/, senão dá "duplicate class").
    sourceSets {
        main {
            java.srcDir 'auto'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation(platform('org.jetbrains.kotlin:kotlin-bom:1.8.22'))
    // v1.75 (APK 1.4): Android Auto. Car App Library = telas e mapa do carro.
    implementation 'androidx.car.app:app:1.4.0'
    // IconCompat dos ícones de manobra (a Car App Library usa, mas não exporta).
    implementation 'androidx.core:core:1.13.1'
}
