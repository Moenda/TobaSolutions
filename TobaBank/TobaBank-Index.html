<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="supported-color-schemes" content="dark" />
  <title>Toba Bank 🚀</title>
  <meta name="theme-color" content="#0d1117" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="icon" href="../icons/icon-192.png" />
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Toba" />
  <link rel="stylesheet" href="../assets/toba-common.css" />
  <link rel="stylesheet" href="css/bank-base.css" />
</head>

<body>
  <main class="container">
    <header class="toba-header">
      <a class="toba-back" href="../index.html" aria-label="Voltar para o Toba Solutions">‹</a>
      <a class="toba-titles" href="../index.html">
        <span class="toba-app">🏦 Toba Bank</span>
        <span class="toba-page">Hub</span>
      </a>
      <div class="toba-header-actions">
        <button type="button" class="toba-icon-btn toba-gear" data-click="openSettings" aria-label="Configurações">⚙️</button>
      </div>
    </header>

    <div class="toba-kicker">Qual vai ser hoje, magnata?</div>
    <nav class="toba-hub-list" aria-label="Módulos do Toba Bank">
      <a class="toba-hub-card" href="TobaBank-Gastos.html">
        <span class="toba-hub-icon">💸</span>
        <span class="toba-hub-text">
          <span class="toba-hub-title">Controle de Gastos</span>
          <span class="toba-hub-desc">Orçamento do dia, parcelas e contas fixas.</span>
        </span>
        <span class="toba-hub-chevron">›</span>
      </a>
      <a class="toba-hub-card" href="TobaBank-Investimento.html">
        <span class="toba-hub-icon">📈</span>
        <span class="toba-hub-text">
          <span class="toba-hub-title">Investimentos</span>
          <span class="toba-hub-desc">Carteira, rendimentos e cofrinhos.</span>
        </span>
        <span class="toba-hub-chevron">›</span>
      </a>
      <a class="toba-hub-card" href="TobaBank-Raxador.html">
        <span class="toba-hub-icon">🍕</span>
        <span class="toba-hub-text">
          <span class="toba-hub-title">Raxador</span>
          <span class="toba-hub-desc">Divide rolês, viagens e a conta da galera.</span>
        </span>
        <span class="toba-hub-chevron">›</span>
      </a>
    </nav>
  </main>

  <script src="../assets/toba-common.js"></script>
  <script src="../assets/toba-cloud.js"></script>
  <script src="js/bank-core.js"></script>
  <script>
    // O Hub não tem tela de dados; só carrega o banco para a ⚙️ (backup).
    document.addEventListener("DOMContentLoaded", loadDatabase);
  </script>
  <script src="../assets/pwa-register.js"></script>
</body>

</html>
