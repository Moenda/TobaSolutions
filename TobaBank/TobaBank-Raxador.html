<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="color-scheme" content="dark" />
  <meta name="supported-color-schemes" content="dark" />
  <title>Toba Bank | Raxador</title>
  <meta name="theme-color" content="#0d1117" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="icon" href="../icons/icon-192.png" />
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Toba" />
  <link rel="stylesheet" href="../assets/toba-common.css" />
  <link rel="stylesheet" href="css/bank-base.css" />
  <link rel="stylesheet" href="css/raxador.css" />
</head>

<body>
  <div class="container">
    <header class="toba-header">
      <a class="toba-back" href="TobaBank-Index.html" data-label="Voltar para o Toba Bank" aria-label="Voltar para o Toba Bank">‹</a>
      <a class="toba-titles" href="TobaBank-Index.html">
        <span class="toba-app">🏦 Toba Bank</span>
        <span class="toba-page">🍕 Raxador</span>
      </a>
      <div class="toba-header-actions">
        <button type="button" class="toba-add-btn" id="headerAddBtn" data-click="newSplitterGroup">+ Rolê</button>
        <button type="button" class="toba-icon-btn toba-gear" data-click="openSettings" aria-label="Configurações">⚙️</button>
      </div>
    </header>

    <div class="app-view active" id="viewSplitter">
      <div class="section-title is-first text-gold">🏃 Em andamento</div>
      <div id="splitterActiveContainer"></div>

      <div class="section-title text-green">🏁 Finalizados</div>
      <div id="splitterFinishedContainer"></div>
    </div>

    <div class="app-view" id="viewSplitterDetail">
      <input type="hidden" id="splitterGroupIdInput" />

      <div class="splitter-detail-top">
        <h2 id="detailSplitterTitle" class="splitter-detail-title">🍕 Detalhes do rolê</h2>
        <button type="button" class="toba-icon-btn" data-click="toggleSplitterMetaCard" aria-label="Editar rolê">✏️</button>
      </div>

      <div class="card splitter-meta-card" id="splitterMetaCard" hidden>
        <div class="form-group splitter-edit-field">
          <label for="editSplitterName">Nome do rolê</label>
          <input type="text" id="editSplitterName" class="form-control" data-change="updateSplitterGroupMeta" />
        </div>
        <div class="grid-2 splitter-edit-field">
          <div class="form-group">
            <label for="editSplitterCategory">Categoria</label>
            <select id="editSplitterCategory" class="form-control" data-change="updateSplitterGroupMeta">
              <option value="✈️ Viagem">✈️ Viagem</option>
              <option value="🥩 Churrasco">🥩 Churrasco</option>
              <option value="🎉 Festinha / Rolê">🎉 Festinha / Rolê</option>
              <option value="🛒 Compras / Outros">🛒 Compras / Outros</option>
            </select>
          </div>
          <div class="form-group">
            <label for="editSplitterDate">Data</label>
            <input type="date" id="editSplitterDate" class="form-control" data-change="updateSplitterGroupMeta" />
          </div>
        </div>
        <div class="form-group splitter-edit-field">
          <label for="splitterMembersInput">👥 Participantes (separados por vírgula)</label>
          <div class="form-row">
            <input type="text" id="splitterMembersInput" class="form-control" placeholder="Ex: Toba, Gon..." />
            <button type="button" class="btn btn-secondary btn-sm" data-click="saveSplitterMembers">Salvar</button>
          </div>
        </div>
        <div class="btn-row">
          <button type="button" class="btn btn-outline btn-green" id="splitterToggleFinishBtnView" data-click="toggleSplitterFinished">🏁 Finalizar</button>
          <button type="button" class="btn btn-danger" data-click="deleteSplitterGroup">🗑️ Excluir</button>
        </div>
      </div>

      <div class="section-title is-first">
        <span class="text-blue">⚖️ Quem deve pra quem</span>
        <button type="button" class="btn btn-primary btn-sm" id="openAddSplitterExpenseBtn" data-click="newSplitterExpense">💸 + Gasto</button>
      </div>

      <div id="splitterSettlementBox" class="card settlement-box"></div>

      <div class="section-title">📜 Gastos do rolê</div>
      <div id="splitterExpensesList" class="expense-list"></div>
    </div>
  </div>

  <div class="toba-modal" id="newSplitterExpenseModal">
    <div class="toba-sheet">
      <div class="toba-sheet-header">
        <h3 id="splitterExpenseModalTitle">💸 Gasto no rolê</h3>
        <button type="button" class="close-btn" data-close aria-label="Fechar">✕</button>
      </div>
      <form data-submit="saveSplitterExpense">
        <input type="hidden" id="splitterExpenseIdInput" />

        <div class="form-group">
          <label for="splitterExpenseDesc">Descrição</label>
          <input type="text" id="splitterExpenseDesc" class="form-control" placeholder="Ex: Cerveja, Uber, Mercado" />
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label for="splitterExpenseAmount">Valor (R$)</label>
            <input type="text" inputmode="numeric" id="splitterExpenseAmount" class="form-control smart-money" placeholder="0,00" />
          </div>
          <div class="form-group">
            <label for="splitterExpensePayer">Quem pagou?</label>
            <select id="splitterExpensePayer" class="form-control"></select>
          </div>
        </div>

        <div class="form-group">
          <label for="splitterExpenseDate">Data do gasto</label>
          <input type="date" id="splitterExpenseDate" class="form-control" />
        </div>

        <div class="form-group">
          <label id="splitterSharesTitleLabel">⚖️ Divisão por participante (%)</label>
          <div id="splitterExpenseSharesContainer" class="share-rows"></div>
        </div>

        <div class="toba-sheet-footer">
          <div class="btn-row">
            <button type="button" class="btn btn-danger btn-grow-1" id="deleteSplitterExpenseBtn" data-click="deleteSplitterExpenseFromModal" hidden>🗑️ Apagar</button>
            <button type="submit" class="btn btn-primary btn-grow-2" id="saveSplitterExpenseBtn">Salvar gasto</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="toba-modal" id="newSplitterModal">
    <div class="toba-sheet">
      <div class="toba-sheet-header">
        <h3>🍕 Novo rolê</h3>
        <button type="button" class="close-btn" data-close aria-label="Fechar">✕</button>
      </div>
      <form id="newSplitterForm" data-submit="createSplitterGroup">
        <div class="form-group">
          <label for="newSplitterName">Nome do grupo / rolê</label>
          <input type="text" id="newSplitterName" class="form-control" placeholder="Ex: Churrasco dos Cria, Viagem Praia" required />
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label for="newSplitterCategory">Categoria</label>
            <select id="newSplitterCategory" class="form-control">
              <option value="✈️ Viagem">✈️ Viagem</option>
              <option value="🥩 Churrasco">🥩 Churrasco</option>
              <option value="🎉 Festinha / Rolê">🎉 Festinha / Rolê</option>
              <option value="🛒 Compras / Outros">🛒 Compras / Outros</option>
            </select>
          </div>
          <div class="form-group">
            <label for="newSplitterDate">Data</label>
            <input type="date" id="newSplitterDate" class="form-control" required />
          </div>
        </div>
        <div class="form-group">
          <label for="newSplitterMembers">Participantes (separados por vírgula)</label>
          <input type="text" id="newSplitterMembers" class="form-control" placeholder="Ex: Toba, Gon, Killua, Naruto" required />
        </div>
        <div class="toba-sheet-footer">
          <button type="submit" class="btn btn-primary">Criar rolê</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../assets/toba-common.js"></script>
  <script src="js/bank-core.js"></script>
  <script src="js/raxador.js"></script>
  <script src="../assets/pwa-register.js"></script>
</body>

</html>
