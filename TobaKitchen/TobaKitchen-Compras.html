<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="color-scheme" content="dark" />
  <meta name="supported-color-schemes" content="dark" />
  <meta name="theme-color" content="#0d1117" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="icon" href="../icons/icon-192.png" />
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Toba" />
  <link rel="stylesheet" href="../assets/toba-common.css" />
  <link rel="stylesheet" href="css/kitchen-base.css" />
  <title>Toba Kitchen | Lista de compras</title>
</head>

<body>
  <div class="container">
    <header class="toba-header">
      <a class="toba-back" href="TobaKitchen-Index.html" data-label="Voltar para o Toba Kitchen" aria-label="Voltar para o Toba Kitchen">‹</a>
      <a class="toba-titles" href="TobaKitchen-Index.html">
        <span class="toba-app">🍳 Toba Kitchen</span>
        <span class="toba-page">🛒 Lista de compras</span>
      </a>
      <div class="toba-header-actions">
        <button type="button" class="toba-icon-btn toba-gear" data-click="openSettings" aria-label="Configurações">⚙️</button>
      </div>
    </header>

    <div class="tab-nav">
      <button type="button" class="tab-btn" id="tabPick" data-click="shopTab" data-tab="pick">🧺 Escolher</button>
      <button type="button" class="tab-btn" id="tabList" data-click="shopTab" data-tab="list">🛒 Lista</button>
    </div>

    <!-- Escolher: toca nos itens (igual ao "O que tem aí?") -->
    <section id="viewPick" hidden>
      <input type="search" class="form-control kt-search" id="pickSearch" placeholder="🔎 Buscar item" data-input="filterPick" autocomplete="off" />
      <div id="pickGroups"></div>
      <div class="kt-aisle" id="otherTitle">✍️ Outros</div>
      <form class="kt-other-form" data-submit="addOther" autocomplete="off">
        <input type="text" class="form-control" id="otherName" maxlength="40" placeholder="Não achou? Digita aqui" enterkeyhint="done" />
        <button type="submit" class="btn kt-btn-fire">➕</button>
      </form>
      <div class="kt-chips is-wrap" id="otherChips"></div>
      <button type="button" class="btn kt-btn-fire kt-pantry-go" id="pickGo" data-click="shopTab" data-tab="list">🛒 Ver a lista</button>
    </section>

    <!-- Lista: o que levar, com a semana das receitas -->
    <section id="viewList" hidden>
      <div class="kt-week-nav">
        <button type="button" class="round-btn" data-click="moveShopWeek" data-dir="-1" aria-label="Semana anterior">‹</button>
        <span class="kt-week-label" id="shopWeekLabel"></span>
        <button type="button" class="round-btn" data-click="moveShopWeek" data-dir="1" aria-label="Próxima semana">›</button>
      </div>
      <div class="kt-shop-progress"><span id="shopSummary"></span><span id="shopProgress"></span></div>
      <div class="progress-track"><div class="progress-fill kt-fill" id="shopFill"></div></div>
      <div id="shopList"></div>
      <button type="button" class="btn btn-secondary kt-clear-extras" id="clearExtrasBtn" data-click="clearBoughtExtras" hidden>🧹 Tirar comprados da lista</button>
      <div class="btn-row">
        <button type="button" class="btn btn-secondary" data-click="uncheckAll">↺ Desmarcar tudo</button>
        <button type="button" class="btn kt-btn-fire" data-click="copyShopping">📤 Mandar lista</button>
      </div>
    </section>
  </div>

  <div id="tobaSettingsExtra" hidden></div>

  <script src="../assets/toba-common.js"></script>
  <script src="../assets/toba-cloud.js"></script>
  <script src="js/kitchen-recipes.js"></script>
  <script src="js/kitchen-core.js"></script>
  <script src="js/compras.js"></script>
  <script src="../assets/pwa-register.js"></script>
</body>

</html>
