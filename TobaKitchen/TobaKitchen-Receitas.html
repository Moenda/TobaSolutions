<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="color-scheme" content="dark" />
  <meta name="supported-color-schemes" content="dark" />
  <meta name="theme-color" content="#0d1117" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="icon" href="../icons/icon-192.png" />
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Toba" />
  <link rel="stylesheet" href="../assets/toba-common.css" />
  <link rel="stylesheet" href="../assets/toba-player.css" />
  <link rel="stylesheet" href="css/kitchen-base.css" />
  <title>Toba Kitchen | Receitas</title>
</head>

<body>
  <div class="container">
    <header class="toba-header">
      <a class="toba-back" href="TobaKitchen-Index.html" data-label="Voltar para o Toba Kitchen" aria-label="Voltar para o Toba Kitchen">‹</a>
      <a class="toba-titles" href="TobaKitchen-Index.html">
        <span class="toba-app">🍳 Toba Kitchen</span>
        <span class="toba-page">📖 Receitas</span>
      </a>
      <div class="toba-header-actions">
        <button type="button" class="toba-icon-btn toba-gear" data-click="openSettings" aria-label="Configurações">⚙️</button>
      </div>
    </header>

    <!-- Livro: busca, categorias e lista -->
    <section class="app-view active" id="viewBook">
      <div id="cookResume"></div>
      <button type="button" class="kt-launch" data-click="openPantry">
        <span class="kt-launch-icon">🧺</span>
        <span class="kt-launch-copy">
          <span class="kt-launch-title">O que tem aí na geladeira?</span>
          <span class="kt-launch-detail" id="pantryLaunchDetail">Marca os ingredientes e o Toba diz o que dá pra fazer.</span>
        </span>
      </button>
      <input type="search" class="form-control kt-search" id="bookSearch" placeholder="🔎 Buscar receita ou ingrediente" data-input="filterBook" autocomplete="off" />
      <div class="kt-chips" id="bookMeals"></div>
      <div class="toba-list" id="bookList"></div>
    </section>

    <!-- O que tem aí? (busca por ingredientes) -->
    <section class="app-view" id="viewPantry">
      <div class="tab-nav">
        <button type="button" class="tab-btn active" id="pantryTabHave" data-click="pantryTab" data-tab="have">🧺 Tenho</button>
        <button type="button" class="tab-btn" id="pantryTabCan" data-click="pantryTab" data-tab="can">🍳 Dá pra fazer</button>
      </div>
      <div id="pantryHave">
        <div class="kt-pantry-top">
          <input type="search" class="form-control kt-search" id="pantrySearch" placeholder="🔎 Filtrar ingrediente" data-input="filterPantry" autocomplete="off" />
          <button type="button" class="chip-btn" data-click="clearPantry">🧽 Limpar</button>
        </div>
        <div class="hint-box kt-hint">Sal, açúcar, óleo, azeite e temperos o Toba já conta que você tem 🧂</div>
        <div id="pantryGroups"></div>
        <button type="button" class="btn kt-btn-fire kt-pantry-go" id="pantryGo" data-click="pantryTab" data-tab="can">🍳 Ver o que dá pra fazer</button>
      </div>
      <div id="pantryCan" hidden></div>
    </section>

    <!-- Detalhe da receita -->
    <section class="app-view" id="viewRecipe"></section>
  </div>

  <!-- Modo cozinha (passo a passo, tela cheia) -->
  <div class="toba-fullpage" id="viewCook">
    <div class="toba-fullpage-body kt-cook" id="cookBody"></div>
  </div>

  <div id="tobaSettingsExtra" hidden></div>

  <!-- Ingredientes durante o modo cozinha -->
  <div class="toba-modal" id="cookIngredientsSheet">
    <div class="toba-sheet">
      <div class="toba-sheet-header">
        <h3>🧺 Ingredientes</h3>
        <button type="button" class="close-btn" data-close aria-label="Fechar">✕</button>
      </div>
      <div class="kt-ing-list" id="cookIngredientsList"></div>
    </div>
  </div>

  <!-- Pôr a receita na programação da semana -->
  <div class="toba-modal" id="planSheet">
    <div class="toba-sheet">
      <div class="toba-sheet-header">
        <h3>📅 Pôr na semana</h3>
        <button type="button" class="close-btn" data-close aria-label="Fechar">✕</button>
      </div>
      <p class="toba-sheet-text" id="planSheetText"></p>
      <div class="kt-chips is-wrap" id="planMeals"></div>
      <div class="kt-day-pick" id="planDays"></div>
    </div>
  </div>

  <script src="../assets/toba-common.js"></script>
  <script src="js/kitchen-recipes.js"></script>
  <script src="../TobaHealth/js/health-metrics.js"></script>
  <script src="../TobaRoutine/js/routine-metrics.js"></script>
  <script src="../assets/toba-player.js"></script>
  <script src="js/kitchen-core.js"></script>
  <script src="js/receitas.js"></script>
  <script src="../assets/pwa-register.js"></script>
</body>

</html>
