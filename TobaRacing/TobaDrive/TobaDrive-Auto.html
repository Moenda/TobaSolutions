<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="color-scheme" content="dark light" />
  <meta name="robots" content="noindex" />
  <!-- v1.78 (v1.80: faixas, radar, rua atual; v2.02: tudo maior): mapa da tela do carro (Android Auto, APK 1.7). Só abre dentro do app:
       o WebMap.java desenha esta página na tela do carro e manda carro/rota/painel
       por window.tobaAuto. No navegador mostra um mapa parado de demonstração. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mapbox-gl@3.7.0/dist/mapbox-gl.css" />
  <link rel="stylesheet" href="css/auto-map.css" />
  <title>Toba · Android Auto</title>
</head>

<body class="am-dark">
  <div id="amMap"></div>

  <div id="amHud">
    <div class="am-top">
      <div class="am-turn" id="amTurn" hidden>
        <div class="am-turn-icon" id="amTurnIcon"></div>
        <div class="am-turn-txt">
          <b id="amTurnDist"></b>
          <span id="amTurnStreet"></span>
        </div>
      </div>
      <div class="am-lanes" id="amLanes" hidden></div>
      <div class="am-radar" id="amRadar" hidden></div>
      <div class="am-cloba" id="amCloba" hidden></div>
    </div>

    <div class="am-bottom" id="amBottom">
      <!-- v1.81: velocidade + placa num bloco só (placa grudada na bolinha, tipo Waze) -->
      <div class="am-gauge">
        <div class="am-speed" id="amSpeed"><b id="amSpeedNum">0</b><small>km/h</small></div>
        <div class="am-limit" id="amLimit" hidden><b id="amLimitNum"></b></div>
      </div>
    </div>

    <!-- v2.02: chegada em 2 linhas grandes no canto de baixo à direita (minutos / hora · km) -->
    <div class="am-eta" id="amEta" hidden>
      <b id="amEtaClock"></b>
      <div class="am-eta-sub"><span id="amEtaAt"></span><span id="amEtaLeft"></span></div>
      <div class="am-eta-bar"><i id="amEtaBar"></i></div>
    </div>

    <!-- v1.81: rua atual no meio, embaixo da seta (v2.02: sempre centralizada) -->
    <div class="am-road" id="amRoad" hidden></div>

    <div class="am-note" id="amNote" hidden></div>
  </div>

  <script src="../../assets/toba-maps.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mapbox-gl@3.7.0/dist/mapbox-gl.js"></script>
  <script src="js/auto-map.js"></script>
</body>

</html>
