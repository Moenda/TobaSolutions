<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="color-scheme" content="dark" />
  <meta name="supported-color-schemes" content="dark" />
  <meta name="theme-color" content="#0d1117" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="icon" href="../icons/icon-192.png" />
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Toba" />
  <script>
    // Até a v1.42 esta página era a rotina. Notificação/atalho antigo (?task=...) vai direto pra ela.
    if (location.search) location.replace(`TobaRoutine-Rotina.html${location.search}`);
  </script>
  <link rel="stylesheet" href="../assets/toba-common.css" />
  <link rel="stylesheet" href="css/routine-base.css" />
  <title>Toba Routine ⚡</title>
</head>

<body>
  <main class="container">
    <header class="toba-header">
      <a class="toba-back" href="../index.html" aria-label="Voltar para o Toba Solutions">‹</a>
      <a class="toba-titles" href="../index.html">
        <span class="toba-app">⚡ Toba Routine</span>
        <span class="toba-page">Hub</span>
      </a>
      <div class="toba-header-actions">
        <button type="button" class="toba-icon-btn toba-gear" data-click="openSettings" aria-label="Configurações">⚙️</button>
      </div>
    </header>

    <div class="toba-kicker">Qual vai ser hoje, parça?</div>
    <nav class="toba-hub-list" aria-label="Módulos do Toba Routine">
      <a class="toba-hub-card" href="TobaRoutine-Rotina.html">
        <span class="toba-hub-icon">🔁</span>
        <span class="toba-hub-text">
          <span class="toba-hub-title">Rotina</span>
          <span class="toba-hub-desc" id="hubRoutineDesc">Tarefas de todo dia, semana e mês com XP.</span>
        </span>
        <span class="toba-hub-chevron">›</span>
      </a>
      <a class="toba-hub-card" href="TobaRoutine-Task.html">
        <span class="toba-hub-icon">🛠️</span>
        <span class="toba-hub-text">
          <span class="toba-hub-title">Task</span>
          <span class="toba-hub-desc" id="hubTaskDesc">Pintar o quarto, consertar a privada... o Toba acha o dia.</span>
        </span>
        <span class="toba-hub-chevron">›</span>
      </a>
    </nav>

    <div class="section-title">🆓 Seu tempo livre</div>
    <div class="card rt-week-card" role="button" tabindex="0" data-click="openAgendaWeek" aria-label="Abrir a agenda da semana">
      <div class="rt-week-free" id="hubWeekFree"></div>
      <span class="rt-help" id="hubWeekHelp"></span>
    </div>
  </main>

  <!-- Itens só desta página dentro da ⚙️ -->
  <div id="tobaSettingsExtra" hidden>
    <div class="toba-settings-section">
      <div class="toba-settings-label">🕰️ Seu dia</div>
      <button type="button" class="toba-menu-btn" data-click="openDayPlan">
        <span class="toba-menu-icon">🕰️</span>
        <span class="toba-menu-text">
          <span class="toba-menu-title">Meu dia fixo</span>
          <span class="toba-menu-desc">Sono, trabalho, transporte e o que mais tomar tempo</span>
        </span>
        <span class="toba-hub-chevron">›</span>
      </button>
    </div>
  </div>

  <script src="../assets/toba-common.js"></script>
  <script src="js/routine-metrics.js"></script>
  <script src="js/routine-core.js"></script>
  <script src="js/routine-plan.js"></script>
  <script>
    // O Hub só mostra um resumo; quem grava é a ⚙️ (backup e Meu dia fixo). O tempo livre abre a Agenda.
    function renderRoutineHub() {
      const today = toIsoDate();
      const summary = calcRoutineToday(routineDb, today);
      document.getElementById("hubRoutineDesc").textContent = summary.total
        ? `Hoje: ${summary.done}/${summary.total} feitas${summary.overdue ? ` · ⏰ ${summary.overdue} atrasadas` : ""}.`
        : "Tarefas de todo dia, semana e mês com XP.";
      const oneoffs = (routineDb.oneoffs || []).filter((o) => !o.archivedAt && !o.doneAt);
      const queue = oneoffs.filter((o) => routineOneoffStatus(o, today).toPlan > 0).length;
      const todayCount = oneoffs.filter((o) => o.sessions.some((s) => s.date === today && !s.doneAt)).length;
      document.getElementById("hubTaskDesc").textContent = oneoffs.length
        ? [todayCount ? `🎯 ${todayCount} pra hoje` : "", queue ? `📥 ${queue} na fila` : "", `${oneoffs.length} em aberto`].filter(Boolean).join(" · ")
        : "Pintar o quarto, consertar a privada... o Toba acha o dia.";
      const monday = routineAddDays(today, -((new Date().getDay() + 6) % 7));
      document.getElementById("hubWeekFree").innerHTML = TOBA_WEEK_DAYS.map(([, label], i) => {
        const day = routineAddDays(monday, i);
        const load = calcRoutineDayLoad(routineDb, day, { now: new Date() });
        const past = day < today;
        return `<button type="button" class="rt-free-day${day === today ? " is-today" : ""}${past ? " is-past" : ""}" data-click="openAgendaDay" data-date="${day}" aria-label="Agenda de ${label}"><span>${label}</span><strong>${past ? "—" : routineFormatMinutes(load.free)}</strong></button>`;
      }).join("");
      document.getElementById("hubWeekHelp").textContent = routineDb.dayPlan.configured
        ? "Livre depois do dia fixo, da rotina, das tasks e do respiro. Toque num dia pra ver a agenda 📅"
        : "⚠️ Tá no chute (9h–18h, dorme 23h30). Conta como é o seu dia na ⚙️ → Meu dia fixo.";
    }
    // Agenda (desde v1.46): o card abre a semana; o dia abre direto nele. Ajustar o dia fixo é na ⚙️.
    function openAgendaWeek() {
      location.href = `TobaRoutine-Agenda.html?view=week&date=${toIsoDate()}`;
    }
    function openAgendaDay(el) {
      location.href = `TobaRoutine-Agenda.html?view=day&date=${el.dataset.date}`;
    }
    tobaActions({ openAgendaWeek, openAgendaDay });
    function onRoutinePlanChanged() {
      renderRoutineHub();
    }
    function onRoutineDataReplaced() {
      renderRoutineHub();
    }
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") renderRoutineHub();
    });
    renderRoutineHub();
  </script>
  <script src="../assets/pwa-register.js"></script>
</body>

</html>
