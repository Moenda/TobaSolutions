<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="color-scheme" content="dark" />
  <meta name="supported-color-schemes" content="dark" />
  <meta name="theme-color" content="#0d1117" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="icon" href="../icons/icon-192.png" />
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Toba" />
  <link rel="stylesheet" href="../assets/toba-common.css" />
  <link rel="stylesheet" href="../assets/toba-player.css" />
  <link rel="stylesheet" href="css/routine-base.css" />
  <title>Toba Routine ⚡</title>
</head>

<body>
  <div class="container">
    <header class="toba-header">
      <a class="toba-back" href="TobaRoutine-Index.html" data-label="Voltar para o hub do Routine" aria-label="Voltar para o hub do Routine">‹</a>
      <a class="toba-titles" href="TobaRoutine-Index.html">
        <span class="toba-app">⚡ Toba Routine</span>
        <span class="toba-page">✅ Hoje</span>
      </a>
      <div class="toba-header-actions">
        <button type="button" class="toba-add-btn" data-click="newTask">+ Tarefa</button>
        <button type="button" class="toba-icon-btn toba-gear" data-click="openSettings" aria-label="Configurações">⚙️</button>
      </div>
    </header>

    <div class="tab-nav rt-tabs" role="tablist">
      <button type="button" class="tab-btn active" data-click="showRoutineView" data-view="viewToday">✅ Hoje</button>
      <button type="button" class="tab-btn" data-click="showRoutineView" data-view="viewTasks">📋 Tarefas</button>
      <button type="button" class="tab-btn" data-click="showRoutineView" data-view="viewHistory">📜 Histórico</button>
    </div>

    <div id="viewToday" class="app-view active">
      <section class="card rt-hero" id="rtHero"></section>
      <div id="rtNotice"></div>
      <div class="section-title" id="rtTodayTitle">📅 Hoje</div>
      <div class="rt-list" id="rtTodayList"></div>
      <div id="rtOneoffs"></div>
      <div id="rtOverdue"></div>
      <div id="rtTomorrow"></div>
      <div id="rtSituational"></div>
    </div>

    <div id="viewTasks" class="app-view">
      <div id="rtTaskList"></div>
      <button type="button" class="btn btn-secondary rt-wide-btn" data-click="openSuggestions">💡 Ver sugestões de tarefas</button>
    </div>

    <div id="viewHistory" class="app-view">
      <div id="rtHistory"></div>
    </div>
  </div>

  <!-- Itens só desta página dentro da ⚙️ -->
  <div id="tobaSettingsExtra" hidden>
    <div class="toba-settings-section">
      <div class="toba-settings-label">🕰️ Seu dia</div>
      <button type="button" class="toba-menu-btn" data-click="openDayPlan">
        <span class="toba-menu-icon">🕰️</span>
        <span class="toba-menu-text">
          <span class="toba-menu-title">Meu dia fixo</span>
          <span class="toba-menu-desc">Sono, trabalho, transporte e o que mais tomar tempo</span>
        </span>
        <span class="toba-hub-chevron">›</span>
      </button>
    </div>
    <div class="toba-settings-section">
      <div class="toba-settings-label">🔔 Avisos e cobranças</div>
      <p class="toba-sheet-text" id="rtNotifyHelp"></p>
      <button type="button" class="btn btn-secondary rt-wide-btn" data-click="enableRoutineNotify" id="rtNotifyBtn">🔔 Permitir notificações</button>
    </div>
  </div>

  <!-- Sugestões (1ª abertura e pela aba Tarefas) -->
  <div class="toba-modal" id="suggestSheet" role="dialog" aria-modal="true" aria-labelledby="suggestSheetTitle">
    <div class="toba-sheet">
      <div class="toba-sheet-header">
        <h3 id="suggestSheetTitle">💡 Bora montar a rotina?</h3>
        <button type="button" class="close-btn" data-close aria-label="Fechar">✕</button>
      </div>
      <p class="toba-sheet-text">Marque as que fazem sentido. Dá para editar horário, dias e dificuldade depois.</p>
      <div class="rt-suggest-list" id="suggestList"></div>
      <div class="toba-sheet-footer">
        <button type="button" class="btn btn-primary" data-click="addSuggestions">Adicionar as marcadas</button>
      </div>
    </div>
  </div>

  <script src="../assets/toba-common.js"></script>
  <script src="../assets/toba-cloud.js"></script>
  <script src="js/routine-metrics.js"></script>
  <script src="js/routine-core.js"></script>
  <script src="../TobaHealth/js/health-metrics.js"></script>
  <script src="../TobaKitchen/js/kitchen-recipes.js"></script>
  <script src="../TobaRacing/js/racing-metrics.js"></script>
  <script src="../TobaTurism/js/turism-metrics.js"></script>
  <script src="../assets/toba-player.js"></script>
  <script src="js/routine-alerts.js"></script>
  <script src="js/routine-plan.js"></script>
  <script src="js/routine-task-sheet.js"></script>
  <script src="js/routine.js"></script>
  <script src="../assets/pwa-register.js"></script>
</body>

</html>
