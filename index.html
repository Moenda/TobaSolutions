<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOBA SOLUTIONS ⚡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #f0f6fc;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 1.5rem 1rem;
        }
        .container {
            background: #161b22;
            padding: 1.5rem;
            border-radius: 20px;
            border: 1px solid #30363d;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo {
            font-size: 2rem;
            font-weight: 800;
            color: #58a6ff;
            letter-spacing: -1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .subtitle {
            font-size: 0.85rem;
            color: #8b949e;
            margin-top: 6px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }
        .app-card {
            background: #0d1117;
            border: 1px solid #21262d;
            border-radius: 16px;
            padding: 1.1rem;
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }
        .app-card:hover {
            border-color: #58a6ff;
            transform: translateY(-2px);
            background: #12161f;
        }
        .app-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .app-icon {
            font-size: 1.8rem;
            background: #161b22;
            width: 50px;
            height: 50px;
            border-radius: 14px;
            border: 1px solid #30363d;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .app-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #f0f6fc;
        }
        .app-desc {
            font-size: 0.78rem;
            color: #8b949e;
            margin-top: 3px;
        }
        .badge {
            font-size: 0.7rem;
            padding: 4px 8px;
            border-radius: 8px;
            font-weight: 700;
            white-space: nowrap;
        }
        .badge-active { background: rgba(63, 185, 80, 0.15); color: #3fb950; }
        .badge-dev { background: rgba(88, 166, 255, 0.15); color: #58a6ff; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo">⚡ TOBA SOLUTIONS</div>
            <div class="subtitle">Seu ecossistema pessoal de controle supremo</div>
        </div>

        <div class="grid">
            <!-- TOBA BANK -->
            <a href="./TobaBank/TobaBank.html" class="app-card">
                <div class="app-info">
                    <div class="app-icon">🏦</div>
                    <div>
                        <div class="app-title">Toba Bank</div>
                        <div class="app-desc">Finanças, aportes e cofrinhos</div>
                    </div>
                </div>
                <span class="badge badge-active">✨ Ativo</span>
            </a>

            <!-- TOBA HEALTH -->
            <a href="./TobaHealth/TobaHealth.html" class="app-card">
                <div class="app-info">
                    <div class="app-icon">🥗</div>
                    <div>
                        <div class="app-title">Toba Health</div>
                        <div class="app-desc">Macros, peso e déficit calórico</div>
                    </div>
                </div>
                <span class="badge badge-dev">🔥 Beta v1.0</span>
            </a>
        </div>
    </div>

</body>
</html>
